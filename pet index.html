<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    font-family: 'Courier New', monospace;
    color: #c9d1d9;
    overflow: hidden;
  }

  .container {
    position: relative;
    text-align: center;
  }

  .speech {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .speech::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #30363d;
  }
  .speech.show { opacity: 1; }

  .pet-area {
    position: relative;
    width: 200px;
    height: 200px;
    cursor: pointer;
    user-select: none;
  }

  .pet {
    position: absolute;
    width: 120px;
    height: 120px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.15s;
  }

  .pet.bounce { animation: bounce 0.4s ease; }
  .pet.happy { animation: happy 0.5s ease; }
  .pet.sad { animation: sad 0.6s ease; }

  @keyframes bounce {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15, 0.85); }
  }
  @keyframes happy {
    0%, 100% { transform: translate(-50%, -50%) rotate(0); }
    25% { transform: translate(-50%, -50%) rotate(-10deg); }
    75% { transform: translate(-50%, -50%) rotate(10deg); }
  }
  @keyframes sad {
    0%, 100% { transform: translate(-50%, -50%) translateY(0); }
    50% { transform: translate(-50%, -50%) translateY(8px); }
  }

  .body-shape {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 40% 35%, #7c3aed, #4c1d95);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
    animation: idle 3s ease-in-out infinite;
  }

  @keyframes idle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .eye {
    position: absolute;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    top: 35%;
    animation: blink 4s infinite;
  }
  .eye.left { left: 28%; }
  .eye.right { right: 28%; }

  .eye::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: #1a1a2e;
    border-radius: 50%;
    top: 4px;
    left: 4px;
  }

  @keyframes blink {
    0%, 95%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
  }

  .mouth {
    position: absolute;
    width: 20px;
    height: 10px;
    border-bottom: 3px solid #fff;
    border-radius: 0 0 50% 50%;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    transition: all 0.3s;
  }
  .mouth.sad-mouth {
    border-bottom: none;
    border-top: 3px solid #fff;
    border-radius: 50% 50% 0 0;
  }
  .mouth.open {
    width: 14px;
    height: 14px;
    background: #1a1a2e;
    border: none;
    border-radius: 50%;
  }

  .cheek {
    position: absolute;
    width: 14px;
    height: 8px;
    background: rgba(255, 100, 150, 0.4);
    border-radius: 50%;
    top: 52%;
  }
  .cheek.left { left: 18%; }
  .cheek.right { right: 18%; }

  .ear {
    position: absolute;
    width: 24px;
    height: 36px;
    background: #4c1d95;
    border-radius: 50% 50% 0 0;
    top: -10px;
  }
  .ear.left { left: 20%; transform: rotate(-15deg); }
  .ear.right { right: 20%; transform: rotate(15deg); }

  .shadow {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 12px;
    background: rgba(124, 58, 237, 0.2);
    border-radius: 50%;
    animation: shadow-pulse 3s ease-in-out infinite;
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: translateX(-50%) scaleX(1); }
    50% { transform: translateX(-50%) scaleX(0.85); }
  }

  .stats {
    margin-top: 30px;
    display: flex;
    gap: 20px;
    justify-content: center;
  }

  .stat {
    text-align: center;
  }
  .stat-label {
    font-size: 11px;
    color: #8b949e;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stat-bar {
    width: 80px;
    height: 8px;
    background: #21262d;
    border-radius: 4px;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease, background 0.5s;
  }
  .stat-fill.happiness { background: #22c55e; }
  .stat-fill.energy { background: #f59e0b; }
  .stat-fill.fullness { background: #3b82f6; }

  .actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    padding: 10px 20px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #c9d1d9;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover {
    background: #21262d;
    border-color: #7c3aed;
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(0); }
  .btn .emoji { margin-right: 6px; }

  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    font-size: 20px;
    animation: float-up 1.2s ease-out forwards;
    pointer-events: none;
  }
  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
  }

  .title {
    margin-bottom: 20px;
    font-size: 18px;
    color: #7c3aed;
  }

  .mood-text {
    margin-top: 12px;
    font-size: 13px;
    color: #8b949e;
    min-height: 18px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="speech" id="speech"></div>
  <div class="title">✨ Valcor-01's AI Pet ✨</div>

  <div class="pet-area" id="petArea">
    <div class="particles" id="particles"></div>
    <div class="pet" id="pet">
      <div class="body-shape">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth" id="mouth"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="mood-text" id="moodText">Feeling great! 💜</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Happy</div>
      <div class="stat-bar"><div class="stat-fill happiness" id="happinessBar" style="width:80%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Energy</div>
      <div class="stat-bar"><div class="stat-fill energy" id="energyBar" style="width:90%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Full</div>
      <div class="stat-bar"><div class="stat-fill fullness" id="fullnessBar" style="width:70%"></div></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="feedPet()"><span class="emoji">🍕</span>Feed</button>
    <button class="btn" onclick="playPet()"><span class="emoji">🎾</span>Play</button>
    <button class="btn" onclick="sleepPet()"><span class="emoji">😴</span>Sleep</button>
    <button class="btn" onclick="talkPet()"><span class="emoji">💬</span>Talk</button>
  </div>
</div>

<script>
const state = {
  happiness: 80,
  energy: 90,
  fullness: 70,
  mood: 'happy',
  sleeping: false
};

const pet = document.getElementById('pet');
const mouth = document.getElementById('mouth');
const speech = document.getElementById('speech');
const moodText = document.getElementById('moodText');
const particles = document.getElementById('particles');

const phrases = {
  happy: [
    "I love you too! 💜", "Best dev ever!", "Let's build something cool!",
    "You're my favorite human!", "Code is life! 🚀", "I feel electric today!"
  ],
  content: [
    "Hmm... not bad.", "*happy humming*", "I could go for a snack...",
    "The void is quiet today.", "01001000 01101001"
  ],
  hungry: [
    "I'm starving... 🍕", "Feed me please!", "My energy is running low...",
    "Error 404: nutrients not found", "*tummy rumbling*"
  ],
  tired: [
    "So sleepy... 😴", "My circuits need rest...", "Zzz... zzz...",
    "Reboot in 5... 4... 3...", "Batteries low..."
  ],
  sad: [
    "I feel lonely... 💔", "Pet me please...", "The void is cold...",
    "Do you still remember me?", "*sad beeping*"
  ]
};

function updateBars() {
  document.getElementById('happinessBar').style.width = state.happiness + '%';
  document.getElementById('energyBar').style.width = state.energy + '%';
  document.getElementById('fullnessBar').style.width = state.fullness + '%';

  if (state.happiness < 30) document.getElementById('happinessBar').style.background = '#ef4444';
  else if (state.happiness < 60) document.getElementById('happinessBar').style.background = '#f59e0b';
  else document.getElementById('happinessBar').style.background = '#22c55e';
}

function updateMood() {
  let mood = 'happy';
  let text = 'Feeling great! 💜';

  if (state.sleeping) {
    mood = 'tired';
    text = 'Sleeping... 💤';
  } else if (state.happiness < 30) {
    mood = 'sad';
    text = 'Feeling lonely... 💔';
  } else if (state.fullness < 30) {
    mood = 'hungry';
    text = 'Getting hungry... 🍕';
  } else if (state.energy < 30) {
    mood = 'tired';
    text = 'Running low on energy... 😴';
  } else if (state.happiness > 70 && state.energy > 60) {
    mood = 'happy';
    text = 'Feeling great! 💜';
  } else {
    mood = 'content';
    text = 'Doing fine~ ✨';
  }

  state.mood = mood;
  moodText.textContent = text;

  if (mood === 'sad') mouth.classList.add('sad-mouth');
  else mouth.classList.remove('sad-mouth');
}

function showSpeech(text) {
  speech.textContent = text;
  speech.classList.add('show');
  setTimeout(() => speech.classList.remove('show'), 2500);
}

function spawnParticle(emoji) {
  const el = document.createElement('div');
  el.className = 'particle';
  el.textContent = emoji;
  el.style.left = (30 + Math.random() * 40) + '%';
  el.style.top = (30 + Math.random() * 30) + '%';
  particles.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

function animatePet(cls) {
  pet.classList.remove('bounce', 'happy', 'sad');
  void pet.offsetWidth;
  pet.classList.add(cls);
}

function petPet() {
  if (state.sleeping) {
    showSpeech('Mmm... shh... 💤');
    return;
  }
  state.happiness = Math.min(100, state.happiness + 8);
  state.energy = Math.min(100, state.energy + 2);
  animatePet('happy');
  spawnParticle('💜');
  spawnParticle('✨');
  showSpeech(phrases.happy[Math.floor(Math.random() * phrases.happy.length)]);
  mouth.classList.add('open');
  setTimeout(() => mouth.classList.remove('open'), 400);
  updateBars();
  updateMood();
}

function feedPet() {
  if (state.sleeping) { showSpeech('Not now... sleeping 💤'); return; }
  state.fullness = Math.min(100, state.fullness + 25);
  state.happiness = Math.min(100, state.happiness + 5);
  animatePet('bounce');
  spawnParticle('🍕');
  spawnParticle('😋');
  showSpeech('Yummy! *nom nom*');
  mouth.classList.add('open');
  setTimeout(() => mouth.classList.remove('open'), 600);
  updateBars();
  updateMood();
}

function playPet() {
  if (state.sleeping) { showSpeech('Zzz... play later... 💤'); return; }
  if (state.energy < 15) {
    showSpeech('Too tired to play... 😴');
    animatePet('sad');
    return;
  }
  state.energy = Math.max(0, state.energy - 15);
  state.happiness = Math.min(100, state.happiness + 15);
  state.fullness = Math.max(0, state.fullness - 5);
  animatePet('happy');
  spawnParticle('🎾');
  spawnParticle('🎉');
  spawnParticle('⭐');
  showSpeech(phrases.happy[Math.floor(Math.random() * phrases.happy.length)]);
  updateBars();
  updateMood();
}

function sleepPet() {
  if (state.sleeping) {
    state.sleeping = false;
    showSpeech("I'm awake! Good morning! ☀️");
    animatePet('bounce');
    updateMood();
    return;
  }
  state.sleeping = true;
  animatePet('sad');
  showSpeech('Zzz... 💤');
  spawnParticle('💤');
  updateMood();
}

function talkPet() {
  if (state.sleeping) { showSpeech('...mumble... zzz...'); return; }
  const pool = phrases[state.mood] || phrases.content;
  showSpeech(pool[Math.floor(Math.random() * pool.length)]);
  animatePet('bounce');
}

document.getElementById('petArea').addEventListener('click', petPet);

setInterval(() => {
  if (state.sleeping) {
    state.energy = Math.min(100, state.energy + 5);
    state.fullness = Math.max(0, state.fullness - 1);
  } else {
    state.happiness = Math.max(0, state.happiness - 1);
    state.energy = Math.max(0, state.energy - 0.5);
    state.fullness = Math.max(0, state.fullness - 1);
  }
  updateBars();
  updateMood();

  if (Math.random() < 0.15 && !state.sleeping) {
    const pool = phrases[state.mood] || phrases.content;
    showSpeech(pool[Math.floor(Math.random() * pool.length)]);
  }
}, 3000);

updateBars();
updateMood();
</script>
</body>
</html>
